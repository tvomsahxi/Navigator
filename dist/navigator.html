<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>セキュリティ規格ナビゲータ</title>
<meta name="description" content="日本・米国・EU・国際規格のサイバーセキュリティ文書を、章レベル・事業ドメイン・業務カテゴリで横断できる CIRT 向けポータル。">
<style>
/* ==========================================================================
   Navigator — サイバーセキュリティ規格・政府文書ポータル
   Palette: cool slate neutrals + viridian accent + flag-derived region hues
   ========================================================================== */

/* ---- Tokens: light is the base definition ------------------------------ */
:root {
  --bg:          #F4F6F8;
  --surface:     #FFFFFF;
  --surface-2:   #FAFBFC;
  --surface-3:   #EDF0F3;
  --ink:         #141A22;
  --ink-2:       #46525F;
  --ink-3:       #6E7C8A;
  --line:        #DCE2E8;
  --line-2:      #C4CDD6;
  --accent:      #0D7A6B;
  --accent-ink:  #FFFFFF;
  --accent-soft: #E1F0ED;
  --accent-line: #9CCEC5;
  --warn:        #8A5A00;
  --warn-soft:   #FBF1DC;
  --warn-line:   #E0C68A;

  --r-int:    #4F5B69;  --r-int-soft: #E9ECEF;
  --r-jp:     #A32334;  --r-jp-soft:  #F8E7E9;
  --r-us:     #33489B;  --r-us-soft:  #E7EAF6;
  --r-eu:     #7C6008;  --r-eu-soft:  #F7EFDC;

  --shadow-1: 0 1px 2px rgba(20, 26, 34, .06), 0 1px 1px rgba(20, 26, 34, .04);
  --shadow-2: 0 10px 30px rgba(20, 26, 34, .13), 0 2px 8px rgba(20, 26, 34, .07);

  --font-sans: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans",
               "Yu Gothic UI", "Yu Gothic", Meiryo, "Noto Sans JP", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
               "Liberation Mono", "Noto Sans Mono", monospace;

  --rail-w: 268px;
  --drawer-w: 560px;
  --topbar-h: 58px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:          #10151B;
    --surface:     #171E26;
    --surface-2:   #1C242D;
    --surface-3:   #222C36;
    --ink:         #E4EAF1;
    --ink-2:       #AAB7C4;
    --ink-3:       #7D8C9A;
    --line:        #2A343F;
    --line-2:      #3B4753;
    --accent:      #45C3B1;
    --accent-ink:  #04241F;
    --accent-soft: #133430;
    --accent-line: #2A6A61;
    --warn:        #D9AE5C;
    --warn-soft:   #2E2716;
    --warn-line:   #5A4A22;

    --r-int:    #9EAAB8;  --r-int-soft: #242C35;
    --r-jp:     #EA8494;  --r-jp-soft:  #331F23;
    --r-us:     #93A2EC;  --r-us-soft:  #1F2540;
    --r-eu:     #D9B65A;  --r-eu-soft:  #2E2716;

    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 12px 34px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .4);
  }
}

:root[data-theme="dark"] {
  --bg:          #10151B;
  --surface:     #171E26;
  --surface-2:   #1C242D;
  --surface-3:   #222C36;
  --ink:         #E4EAF1;
  --ink-2:       #AAB7C4;
  --ink-3:       #7D8C9A;
  --line:        #2A343F;
  --line-2:      #3B4753;
  --accent:      #45C3B1;
  --accent-ink:  #04241F;
  --accent-soft: #133430;
  --accent-line: #2A6A61;
  --warn:        #D9AE5C;
  --warn-soft:   #2E2716;
  --warn-line:   #5A4A22;

  --r-int:    #9EAAB8;  --r-int-soft: #242C35;
  --r-jp:     #EA8494;  --r-jp-soft:  #331F23;
  --r-us:     #93A2EC;  --r-us-soft:  #1F2540;
  --r-eu:     #D9B65A;  --r-eu-soft:  #2E2716;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 12px 34px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .4);
}

/* ---- Base -------------------------------------------------------------- */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---- Topbar ------------------------------------------------------------ */
.topbar {
  position: sticky; top: 0; z-index: 60;
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 18px;
  padding: 0 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: baseline; gap: 10px; flex-shrink: 0; }
.brand__mark {
  font-family: var(--font-mono);
  font-size: 15px; font-weight: 700; letter-spacing: -.02em;
  color: var(--ink);
}
.brand__mark::before {
  content: "";
  display: inline-block;
  width: 7px; height: 7px;
  margin-right: 8px;
  border-radius: 50%;
  background: var(--accent);
  vertical-align: 1px;
}
.brand__sub {
  font-size: 11px; color: var(--ink-3); letter-spacing: .04em;
  white-space: nowrap;
}

.viewtabs { display: flex; gap: 2px; margin-left: 4px; }
.viewtab {
  padding: 5px 12px;
  font-size: 12.5px;
  color: var(--ink-2);
  border-radius: 5px;
  white-space: nowrap;
}
.viewtab:hover { background: var(--surface-3); color: var(--ink); }
.viewtab[aria-selected="true"] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
}

.topbar__spacer { flex: 1; }

.search {
  position: relative; flex-shrink: 1; min-width: 140px; max-width: 330px; width: 330px;
}
.search input {
  width: 100%;
  padding: 7px 30px 7px 11px;
  font: inherit; font-size: 13px;
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 6px;
}
.search input::placeholder { color: var(--ink-3); }
.search input:focus { border-color: var(--accent-line); background: var(--surface); }
.search__clear {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; line-height: 18px; text-align: center;
  color: var(--ink-3); border-radius: 4px; font-size: 15px;
}
.search__clear:hover { background: var(--surface-3); color: var(--ink); }

.iconbtn {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: 6px; color: var(--ink-2);
  border: 1px solid var(--line);
  flex-shrink: 0;
}
.iconbtn:hover { background: var(--surface-3); color: var(--ink); }

.railtoggle { display: none; }

/* ---- Shell ------------------------------------------------------------- */
.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); align-items: start; }

/* ---- Filter rail ------------------------------------------------------- */
.rail {
  position: sticky; top: var(--topbar-h);
  height: calc(100vh - var(--topbar-h));
  overflow-y: auto;
  padding: 16px 14px 40px;
  background: var(--surface);
  border-right: 1px solid var(--line);
}

.rail__head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.rail__count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.rail__count b { color: var(--ink); font-size: 15px; font-weight: 700; }
.rail__reset {
  font-size: 11.5px; color: var(--ink-3);
  padding: 3px 8px; border-radius: 5px; border: 1px solid var(--line);
}
.rail__reset:hover { color: var(--ink); background: var(--surface-3); }

.fgroup { border-top: 1px solid var(--line); padding: 12px 0 4px; }
.fgroup__title {
  font-size: 10.5px; font-weight: 700; letter-spacing: .11em;
  color: var(--ink-3); text-transform: uppercase;
  margin: 0 0 9px;
}
.fgroup__list { display: flex; flex-direction: column; gap: 1px; }

.fopt {
  display: flex; align-items: center; gap: 8px;
  width: 100%; text-align: left;
  padding: 4px 7px;
  border-radius: 5px;
  font-size: 12.5px; line-height: 1.45;
  color: var(--ink-2);
}
.fopt:hover { background: var(--surface-3); color: var(--ink); }
.fopt__box {
  flex-shrink: 0;
  width: 13px; height: 13px;
  border: 1.5px solid var(--line-2);
  border-radius: 3px;
  display: grid; place-items: center;
}
.fopt__label { flex: 1; min-width: 0; }
.fopt__n {
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  font-size: 10.5px; color: var(--ink-3);
}
.fopt[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
.fopt[aria-pressed="true"] .fopt__box {
  background: var(--accent); border-color: var(--accent);
}
.fopt[aria-pressed="true"] .fopt__box::after {
  content: ""; width: 6px; height: 3px;
  border-left: 1.7px solid var(--accent-ink);
  border-bottom: 1.7px solid var(--accent-ink);
  transform: rotate(-45deg) translate(1px, -1px);
}
.fopt--dim { opacity: .38; }

.fcode {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  color: var(--ink-3); letter-spacing: .02em;
}
.fopt[aria-pressed="true"] .fcode { color: var(--accent); }

/* ---- Main -------------------------------------------------------------- */
.main { min-width: 0; padding: 20px 22px 72px; }

.viewhead { max-width: 74ch; margin-bottom: 20px; }
.viewhead h1 {
  margin: 0 0 6px;
  font-size: 22px; font-weight: 800; letter-spacing: -.025em;
  text-wrap: balance;
}
.viewhead p { margin: 0; color: var(--ink-2); font-size: 13px; }

.activefilters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.afchip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px;
  font-size: 11.5px;
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid var(--accent-line);
  border-radius: 20px;
}
.afchip b { font-weight: 700; }
.afchip::after { content: "×"; font-size: 13px; opacity: .7; }
.afchip:hover::after { opacity: 1; }

/* ---- Table ------------------------------------------------------------- */
.tablewrap {
  overflow: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow-1);
}

/* 一覧は自前の縦スクロール面にして、見出し行を常時見えるようにする。
   （overflow を持つ要素が sticky の基準になるため、top は 0 で正しく効く） */
@media (min-width: 1021px) {
  .tablewrap--pane { max-height: calc(100vh - var(--topbar-h) - 172px); min-height: 340px; }
}

table.docs { width: 100%; border-collapse: collapse; min-width: 940px; }

table.docs thead th {
  position: sticky; top: 0;
  z-index: 5;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  padding: 9px 12px;
  text-align: left;
  font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
  color: var(--ink-3); text-transform: uppercase;
  white-space: nowrap;
}
table.docs thead th button {
  display: inline-flex; align-items: center; gap: 4px;
  font: inherit; color: inherit; letter-spacing: inherit;
}
table.docs thead th button:hover { color: var(--ink); }
table.docs thead th .arrow { font-size: 9px; color: var(--accent); }

table.docs tbody tr {
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
table.docs tbody tr:last-child { border-bottom: none; }
table.docs tbody tr:hover { background: var(--surface-2); }
table.docs tbody tr[aria-selected="true"] { background: var(--accent-soft); }
table.docs td { padding: 10px 12px; vertical-align: top; }

.c-doc { min-width: 300px; }
.c-doc__short {
  font-family: var(--font-mono); font-size: 12.5px; font-weight: 700;
  color: var(--ink); letter-spacing: -.01em;
  display: flex; align-items: center; gap: 6px;
}
.c-doc__title {
  font-size: 12px; color: var(--ink-2); line-height: 1.5;
  margin-top: 2px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  line-clamp: 2;
  overflow: hidden;
}
.c-issuer { font-size: 12px; color: var(--ink-2); max-width: 190px; }
.c-year { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink-2); }
.c-chapn { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink-3); text-align: right; }

/* ---- Chips ------------------------------------------------------------- */
.chips { display: flex; flex-wrap: wrap; gap: 3px; max-width: 230px; }

.chip {
  display: inline-block;
  padding: 1px 6px;
  font-size: 10.5px; line-height: 1.6;
  border-radius: 4px;
  white-space: nowrap;
  background: var(--surface-3); color: var(--ink-2);
  border: 1px solid transparent;
}
.chip--code {
  font-family: var(--font-mono); font-weight: 700; letter-spacing: .01em;
}
.chip--sec { opacity: .55; }

.chip--region {
  font-weight: 700;
  border-left-width: 3px; border-left-style: solid; border-radius: 3px;
  padding-left: 6px;
}
.rg-INT { background: var(--r-int-soft); color: var(--r-int); border-left-color: var(--r-int); }
.rg-JP  { background: var(--r-jp-soft);  color: var(--r-jp);  border-left-color: var(--r-jp); }
.rg-US  { background: var(--r-us-soft);  color: var(--r-us);  border-left-color: var(--r-us); }
.rg-EU  { background: var(--r-eu-soft);  color: var(--r-eu);  border-left-color: var(--r-eu); }

.chip--type { border: 1px solid var(--line-2); background: transparent; color: var(--ink-2); }
.chip--type[data-t="LAW"], .chip--type[data-t="REG"] { border-color: var(--ink-3); color: var(--ink); font-weight: 700; }

.chip--cat { background: var(--accent-soft); color: var(--accent); }

.flag-verify {
  display: inline-grid; place-items: center;
  width: 14px; height: 14px;
  font-size: 9px; font-weight: 700;
  color: var(--warn); background: var(--warn-soft);
  border: 1px solid var(--warn-line);
  border-radius: 3px;
  flex-shrink: 0;
}

.empty {
  padding: 60px 20px; text-align: center; color: var(--ink-3); font-size: 13px;
}

/* ---- Drawer ------------------------------------------------------------ */
.scrim {
  position: fixed; inset: 0; z-index: 70;
  background: rgba(12, 17, 23, .38);
  opacity: 0; pointer-events: none;
  transition: opacity .18s ease;
}
.scrim[data-open="true"] { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed; top: 0; right: 0; z-index: 80;
  width: min(var(--drawer-w), 100vw);
  height: 100vh;
  display: flex; flex-direction: column;
  background: var(--surface);
  border-left: 1px solid var(--line);
  box-shadow: var(--shadow-2);
  transform: translateX(100%);
  transition: transform .2s cubic-bezier(.4, 0, .2, 1);
}
.drawer[data-open="true"] { transform: translateX(0); }

@media (prefers-reduced-motion: reduce) {
  .drawer, .scrim { transition: none; }
}

.drawer__bar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.drawer__bar .chips { max-width: none; flex: 1; }
.drawer__body { overflow-y: auto; padding: 20px 24px 60px; }

.d-title {
  font-family: var(--font-mono);
  font-size: 18px; font-weight: 700; letter-spacing: -.02em;
  margin: 0 0 6px; text-wrap: balance;
}
.d-fulltitle { font-size: 14px; font-weight: 600; line-height: 1.6; margin: 0 0 4px; color: var(--ink); }
.d-orig { font-size: 11.5px; color: var(--ink-3); line-height: 1.55; margin: 0 0 18px; font-style: italic; }

.d-meta {
  display: grid; grid-template-columns: max-content 1fr; gap: 5px 16px;
  padding: 13px 0; margin-bottom: 18px;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  font-size: 12.5px;
}
.d-meta dt { color: var(--ink-3); font-size: 11px; letter-spacing: .03em; padding-top: 1px; }
.d-meta dd { margin: 0; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }

.d-sec { margin-bottom: 24px; }
.d-sec__h {
  display: flex; align-items: baseline; gap: 8px;
  margin: 0 0 9px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .11em;
  color: var(--ink-3); text-transform: uppercase;
}
.d-sec__h .n { font-family: var(--font-mono); color: var(--accent); letter-spacing: 0; }
.d-sec p { margin: 0 0 8px; font-size: 13px; line-height: 1.85; }

.d-note {
  padding: 10px 12px;
  background: var(--warn-soft);
  border: 1px solid var(--warn-line);
  border-radius: 6px;
  font-size: 12px; line-height: 1.7; color: var(--ink);
  margin-bottom: 20px;
}
.d-note b { color: var(--warn); }

/* chapters */
.chap { border-top: 1px solid var(--line); padding: 10px 0; }
.chap:last-child { border-bottom: 1px solid var(--line); }
.chap__head { display: flex; gap: 10px; align-items: baseline; }
.chap__no {
  flex-shrink: 0;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  font-size: 11.5px; font-weight: 700;
  color: var(--accent);
  min-width: 76px;
}
.chap__title { font-size: 13px; font-weight: 600; line-height: 1.6; flex: 1; }
.chap__note {
  margin: 5px 0 0 86px;
  font-size: 12px; line-height: 1.75; color: var(--ink-2);
}
.chap__cats { margin: 6px 0 0 86px; display: flex; flex-wrap: wrap; gap: 3px; }

@media (max-width: 560px) {
  .chap__head { flex-direction: column; gap: 2px; }
  .chap__note, .chap__cats { margin-left: 0; }
}

/* relations */
.relgroup { margin-bottom: 12px; }
.relgroup__h {
  font-size: 11px; font-weight: 700; color: var(--ink-2);
  margin-bottom: 5px;
  display: flex; align-items: center; gap: 7px;
}
.relgroup__h .kindbadge {
  font-family: var(--font-mono); font-size: 9.5px; font-weight: 700;
  padding: 1px 6px; border-radius: 3px;
  background: var(--surface-3); color: var(--ink-3);
  letter-spacing: .04em;
}
.rellink {
  display: block; width: 100%; text-align: left;
  padding: 7px 10px; margin-bottom: 3px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 6px;
}
.rellink:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.rellink__top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.rellink__name { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--ink); }
.rellink__note { font-size: 11.5px; color: var(--ink-2); line-height: 1.6; margin-top: 2px; }

/* ---- Category view ----------------------------------------------------- */
.prose { max-width: 74ch; }
.prose p { font-size: 13px; line-height: 1.9; color: var(--ink-2); margin: 0 0 10px; }
.prose strong { color: var(--ink); font-weight: 700; }

.mecebox {
  display: grid; gap: 12px;
  padding: 16px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  margin-bottom: 28px;
  max-width: 82ch;
}
.mecebox__row { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: start; }
.mecebox__k {
  font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
  color: var(--accent); text-transform: uppercase; padding-top: 3px;
}
.mecebox__v { font-size: 12.5px; line-height: 1.8; color: var(--ink-2); }
.mecebox__v b { color: var(--ink); }

@media (max-width: 620px) {
  .mecebox__row { grid-template-columns: 1fr; gap: 2px; }
}

.cluster { margin-bottom: 30px; }
.cluster__head {
  display: flex; align-items: baseline; gap: 12px;
  padding-bottom: 8px; margin-bottom: 14px;
  border-bottom: 2px solid var(--ink);
}
.cluster__name { font-size: 16px; font-weight: 800; letter-spacing: -.02em; }
.cluster__code {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: .1em; color: var(--ink-3);
}
.cluster__desc { font-size: 12px; color: var(--ink-2); flex: 1; text-align: right; }

@media (max-width: 700px) {
  .cluster__head { flex-wrap: wrap; }
  .cluster__desc { text-align: left; width: 100%; }
}

.catgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }

.catcard {
  display: flex; flex-direction: column;
  padding: 15px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  text-align: left;
  box-shadow: var(--shadow-1);
}
.catcard:hover { border-color: var(--accent-line); }
.catcard__head { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.catcard__code {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  padding: 2px 7px; border-radius: 4px;
  background: var(--accent); color: var(--accent-ink);
  letter-spacing: .04em;
}
.catcard__name { font-size: 13.5px; font-weight: 700; flex: 1; line-height: 1.4; }
.catcard__n {
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  font-size: 11px; color: var(--ink-3); white-space: nowrap;
}
.catcard__def { font-size: 12.5px; line-height: 1.8; color: var(--ink-2); margin: 0 0 12px; }

.catcard__sub {
  font-size: 10px; font-weight: 700; letter-spacing: .09em;
  color: var(--ink-3); text-transform: uppercase; margin-bottom: 4px;
}
.catcard__list { margin: 0 0 12px; padding: 0; list-style: none; display: grid; gap: 2px; }
.catcard__list li {
  font-size: 12px; line-height: 1.65; color: var(--ink-2);
  padding-left: 13px; position: relative;
}
.catcard__list li::before {
  content: ""; position: absolute; left: 3px; top: .72em;
  width: 4px; height: 1px; background: var(--line-2);
}
.catcard__roles { font-size: 11.5px; color: var(--ink-3); margin-bottom: 12px; }

.catcard__tb {
  margin-top: auto;
  padding: 9px 11px;
  background: var(--surface-2);
  border: 1px dashed var(--line-2);
  border-radius: 6px;
  font-size: 11.5px; line-height: 1.7; color: var(--ink-2);
}
.catcard__tb b {
  display: block;
  font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 2px;
}

/* ---- Matrix ------------------------------------------------------------ */
table.matrix { border-collapse: collapse; font-size: 12px; min-width: 780px; width: 100%; }
table.matrix th, table.matrix td { border: 1px solid var(--line); }
table.matrix thead th {
  padding: 7px 5px; background: var(--surface-2);
  font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--ink-2);
  vertical-align: bottom;
}
table.matrix th:first-child { width: 24%; }
table.matrix thead th.mx-cat { font-family: var(--font-mono); text-align: center; }
table.matrix tbody th {
  padding: 7px 11px; text-align: left; background: var(--surface-2);
  font-size: 12px; font-weight: 600; white-space: nowrap;
}
table.matrix tbody th .seg {
  display: block; font-size: 9.5px; font-weight: 400; color: var(--ink-3); letter-spacing: .03em;
}
table.matrix td { padding: 0; text-align: center; }
.mxcell {
  display: block; width: 100%; padding: 11px 4px;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  font-size: 12px; color: var(--ink);
}
.mxcell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
.mxcell[data-zero="true"] { color: var(--ink-3); opacity: .4; }
.mxtot { background: var(--surface-3); font-weight: 700; }

.legend {
  display: flex; align-items: center; gap: 8px;
  margin-top: 12px; font-size: 11.5px; color: var(--ink-3);
}
.legend__scale { display: flex; }
.legend__sw { width: 26px; height: 12px; border: 1px solid var(--line); border-right: none; }
.legend__sw:last-child { border-right: 1px solid var(--line); }

/* ---- Relations view ---------------------------------------------------- */
.reledges { display: grid; gap: 8px; }
.reledge {
  display: grid;
  grid-template-columns: minmax(150px, 1.1fr) minmax(96px, max-content) minmax(150px, 1.1fr);
  gap: 12px; align-items: center;
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 7px;
}
.reledge__side { display: flex; align-items: center; gap: 7px; min-width: 0; }
.reledge__name {
  font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  color: var(--ink); text-align: left;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.reledge__name:hover { color: var(--accent); }
.reledge__mid { text-align: center; }
.reledge__arrow {
  font-size: 10px; font-weight: 700; letter-spacing: .04em;
  color: var(--accent); font-family: var(--font-mono);
  white-space: nowrap;
}
.reledge__note {
  grid-column: 1 / -1;
  font-size: 11.5px; color: var(--ink-3); line-height: 1.6;
  padding-left: 2px;
}

@media (max-width: 720px) {
  .reledge { grid-template-columns: 1fr; gap: 4px; }
  .reledge__mid { text-align: left; }
}

/* ---- Responsive -------------------------------------------------------- */
@media (max-width: 1020px) {
  .shell { grid-template-columns: 1fr; }
  .rail {
    display: none;
    position: fixed; top: var(--topbar-h); left: 0; z-index: 65;
    width: min(300px, 86vw);
    box-shadow: var(--shadow-2);
    border-right: 1px solid var(--line);
  }
  .rail[data-open="true"] { display: block; }
  .railtoggle { display: grid; }
  .brand__sub { display: none; }
}

@media (max-width: 720px) {
  .topbar { gap: 10px; padding: 0 12px; }
  .viewtabs { display: none; }
  .viewtabs[data-mobile="true"] {
    display: flex;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 55;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 5px 8px; gap: 4px;
    overflow-x: auto;
  }
  .main { padding: 16px 12px 84px; }
  .search { width: auto; }

  /* 狭い画面では文書・地域・種別・業務カテゴリだけ残し、横スクロールを避ける。
     省いた項目は行を開けば詳細パネルに全て出る。 */
  table.docs { min-width: 0; }
  table.docs thead th:nth-child(4), table.docs tbody td:nth-child(4),
  table.docs thead th:nth-child(5), table.docs tbody td:nth-child(5),
  table.docs thead th:nth-child(6), table.docs tbody td:nth-child(6),
  table.docs thead th:nth-child(7), table.docs tbody td:nth-child(7) { display: none; }
  .chips { max-width: 96px; }
  .c-doc { min-width: 0; }
  table.docs td { padding: 9px 7px; }
}

@media (max-width: 560px) {
  /* さらに狭い画面では業務カテゴリ列も畳み、文書名を読める幅に戻す。
     カテゴリは絞り込みと詳細パネルから辿れる。 */
  table.docs thead th:nth-child(8), table.docs tbody td:nth-child(8) { display: none; }
  .c-doc__title { -webkit-line-clamp: 3; line-clamp: 3; }
}

</style>

    { no: "分析", title: "IoT のリスクを認識する", cat: ["RSK"], note: "守るべきものの特定、つながることによるリスクの想定、過去の事例に学ぶ。" },

    { no: "構築・接続", title: "ネットワーク上での対策を考える", cat: ["OPS"], note: "機能・用途に応じた適切なネットワーク接続、初期設定への留意、認証機能の導入。" },
    { no: "運用・保守", title: "安全安心な状態を維持し、情報発信・共有を行う", cat: ["OPS", "IRS"], note: "出荷・リリース後の更新、サポート期間の明示、脆弱性情報の受付と発信、関係者の役割の明確化。" },
    { no: "利用者向け", title: "一般利用者のためのルール", cat: ["HRD"] }

  rel: [{ to: "etsi303645", kind: "align" }, { to: "nist-ir-8259", kind: "align" }, { to: "jp-cpsf", kind: "ref" }]
},
{
  id: "jp-medical-gl",
  short: "医療情報システム安全管理ガイドライン",
  title: "医療情報システムの安全管理に関するガイドライン 第6.0版",
  orig: "Guidelines for the Security Management of Medical Information Systems, Ver 6.0",
  issuer: "厚生労働省",
  region: "JP", type: "GL", version: "第6.0版（以降改定）", year: 2023,
  binding: "任意（医療法上の義務・診療報酬要件を通じて実効化）",
  url: "https://www.mhlw.go.jp/stf/shingi/0000516275.html",
  summary: "医療機関等における医療情報システムの安全管理の指針。第6.0版で「概説編」「経営管理編」「企画管理編」「システム運用編」に再構成され、読者の役割別に整理された。医療機関へ設備・システムを納入する場合や、病院向けのビル設備・空調・電力設備がネットワーク接続される場合に、顧客側の要求の根拠となる。ランサムウェアによる診療停止事案を受けてバックアップと BCP の記述が強化されている。",
  scope: "医療機関等と、医療情報システム・医療機関向け設備を提供する事業者。",
  domains: ["BLD", "IT", "LIFE"],
  cats: ["GOV", "OPS", "BCP", "IRS", "SCM"],
  chapters: [
    { no: "概説編", title: "ガイドラインの全体像と読み方", cat: ["GOV"] },
    { no: "経営管理編", title: "経営者が果たすべき責任", cat: ["GOV", "RSK"], note: "リスク評価、体制、委託先管理、非常時の対応方針。" },
    { no: "企画管理編", title: "システムの企画・調達・運用体制の管理", cat: ["SCM", "OPS", "BCP"], note: "外部委託・クラウド利用、ネットワークの管理、非常時（サイバー攻撃を含む）の対応と BCP。" },
    { no: "システム運用編", title: "技術的な安全管理措置", cat: ["OPS", "MON"], note: "認証・アクセス制御、ログ、バックアップ、外部ネットワーク接続、機器の管理。" }
  ],
  rel: [{ to: "jp-cii-plan", kind: "parent" }, { to: "iso27001", kind: "align" }, { to: "jp-building-gl", kind: "ref", note: "病院のビル設備側の対策" }]
}

]);

</script>
<script>
/* Navigator — portal application logic (no build step, no dependencies) */
(function () {
  "use strict";

  var NAV = window.NAV;
  var DOCS = NAV.documents;

  /* ---- lookups --------------------------------------------------------- */
  var byId = {};
  var regionOf = {}, typeOf = {}, catOf = {}, domainOf = {}, clusterOf = {};
  NAV.regions.forEach(function (r) { regionOf[r.code] = r; });
  NAV.types.forEach(function (t) { typeOf[t.code] = t; });
  NAV.categories.forEach(function (c) { catOf[c.code] = c; });
  NAV.domains.forEach(function (d) { domainOf[d.code] = d; });
  NAV.clusters.forEach(function (c) { clusterOf[c.code] = c; });

  var CAT_ORDER = NAV.categories.map(function (c) { return c.code; });

  /* Normalise: catsAll = 文書として宣言したカテゴリ ∪ 章に付いたカテゴリ。
     一覧の表示は宣言済み（主用途）を優先し、章由来のみのものは副次として薄く出す。 */
  DOCS.forEach(function (d) {
    d.cats = d.cats || [];
    d.domains = d.domains || [];
    d.chapters = d.chapters || [];
    d.rel = d.rel || [];
    var set = {};
    d.cats.forEach(function (c) { set[c] = 1; });
    d.chapters.forEach(function (ch) { (ch.cat || []).forEach(function (c) { set[c] = 1; }); });
    d.catsAll = CAT_ORDER.filter(function (c) { return set[c]; });
    d.catsSecondary = d.catsAll.filter(function (c) { return d.cats.indexOf(c) === -1; });
    d.searchBlob = [
      d.short, d.title, d.orig, d.issuer, d.summary, d.scope, d.version, d.binding,
      d.chapters.map(function (ch) { return ch.no + " " + ch.title + " " + (ch.note || ""); }).join(" "),
      d.domains.map(function (x) { return domainOf[x] ? domainOf[x].name : x; }).join(" "),
      d.catsAll.map(function (x) { return catOf[x] ? catOf[x].name : x; }).join(" ")
    ].join(" ").toLowerCase();
    byId[d.id] = d;
  });

  /* 逆方向の関係も参照できるようにする（A→B を B 側からも見せる） */
  DOCS.forEach(function (d) { d.relIn = []; });
  DOCS.forEach(function (d) {
    d.rel.forEach(function (r) {
      var t = byId[r.to];
      if (t) t.relIn.push({ from: d.id, kind: r.kind, note: r.note });
    });
  });

  /* ---- state ----------------------------------------------------------- */
  var state = {
    view: "docs",
    q: "",
    region: [], type: [], domain: [], cat: [],
    sort: "region", dir: 1,
    selected: null
  };

  var FACETS = ["region", "type", "domain", "cat"];

  /* ---- helpers --------------------------------------------------------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function el(sel) { return document.querySelector(sel); }
  function has(arr, v) { return arr.indexOf(v) !== -1; }

  function matchesExcept(d, skipFacet) {
    if (state.q) {
      var terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      for (var i = 0; i < terms.length; i++) {
        if (d.searchBlob.indexOf(terms[i]) === -1) return false;
      }
    }
    if (skipFacet !== "region" && state.region.length && !has(state.region, d.region)) return false;
    if (skipFacet !== "type" && state.type.length && !has(state.type, d.type)) return false;
    if (skipFacet !== "domain" && state.domain.length &&
        !state.domain.some(function (x) { return has(d.domains, x); })) return false;
    if (skipFacet !== "cat" && state.cat.length &&
        !state.cat.some(function (x) { return has(d.catsAll, x); })) return false;
    return true;
  }
  function matches(d) { return matchesExcept(d, null); }

  function filtered() { return DOCS.filter(matches); }

  var REGION_RANK = { JP: 0, US: 1, EU: 2, INT: 3 };
  var TYPE_RANK = {};
  NAV.types.forEach(function (t, i) { TYPE_RANK[t.code] = i; });

  function sorted(list) {
    var k = state.sort, dir = state.dir;
    var copy = list.slice();
    copy.sort(function (a, b) {
      var v = 0;
      if (k === "region") v = (REGION_RANK[a.region] - REGION_RANK[b.region]) ||
                              (TYPE_RANK[a.type] - TYPE_RANK[b.type]) ||
                              a.short.localeCompare(b.short, "ja");
      else if (k === "name") v = a.short.localeCompare(b.short, "ja");
      else if (k === "issuer") v = a.issuer.localeCompare(b.issuer, "ja");
      else if (k === "type") v = (TYPE_RANK[a.type] - TYPE_RANK[b.type]) || a.short.localeCompare(b.short, "ja");
      else if (k === "year") v = (a.year - b.year) || a.short.localeCompare(b.short, "ja");
      else if (k === "chapters") v = (a.chapters.length - b.chapters.length) || a.short.localeCompare(b.short, "ja");
      return v * dir;
    });
    return copy;
  }

  /* ---- chip renderers -------------------------------------------------- */
  function regionChip(code) {
    var r = regionOf[code];
    return '<span class="chip chip--region rg-' + code + '">' + esc(r ? r.name : code) + "</span>";
  }
  function typeChip(code) {
    var t = typeOf[code];
    return '<span class="chip chip--type" data-t="' + code + '">' + esc(t ? t.name : code) + "</span>";
  }
  function catChips(d, limit) {
    var primary = d.cats.slice();
    var sec = d.catsSecondary.slice();
    var out = [];
    primary.forEach(function (c) {
      out.push('<span class="chip chip--code chip--cat" title="' + esc(catOf[c] ? catOf[c].name : c) + '">' + c + "</span>");
    });
    if (limit && sec.length) {
      sec.forEach(function (c) {
        out.push('<span class="chip chip--code chip--cat chip--sec" title="' +
          esc((catOf[c] ? catOf[c].name : c) + "（章単位で該当）") + '">' + c + "</span>");
      });
    }
    return out.join("");
  }
  function domChips(d) {
    if (d.domains.length === NAV.domains.length) {
      return '<span class="chip" title="' + esc(NAV.domains.map(function (x) { return x.name; }).join("、")) +
        '">全ドメイン</span>';
    }
    var show = d.domains.slice(0, 6), rest = d.domains.slice(6);
    var out = show.map(function (x) {
      var dm = domainOf[x];
      return '<span class="chip chip--code" title="' + esc(dm ? dm.name : x) + '">' + x + "</span>";
    });
    if (rest.length) {
      out.push('<span class="chip chip--code chip--sec" title="' +
        esc(rest.map(function (x) { return domainOf[x] ? domainOf[x].name : x; }).join("、")) +
        '">+' + rest.length + "</span>");
    }
    return out.join("");
  }

  /* ---- filter rail ----------------------------------------------------- */
  function facetCounts(facet, codes, accessor) {
    var pool = DOCS.filter(function (d) { return matchesExcept(d, facet); });
    var counts = {};
    codes.forEach(function (c) { counts[c] = 0; });
    pool.forEach(function (d) {
      var v = accessor(d);
      (Array.isArray(v) ? v : [v]).forEach(function (c) {
        if (counts[c] !== undefined) counts[c]++;
      });
    });
    return counts;
  }

  function renderGroup(title, facet, items, counts) {
    var sel = state[facet];
    var rows = items.map(function (it) {
      var n = counts[it.code] || 0;
      var on = has(sel, it.code);
      return '<button class="fopt' + (n === 0 && !on ? " fopt--dim" : "") + '" role="checkbox"' +
        ' aria-pressed="' + on + '" aria-checked="' + on + '"' +
        ' data-facet="' + facet + '" data-code="' + it.code + '"' +
        (it.tip ? ' title="' + esc(it.tip) + '"' : "") + ">" +
        '<span class="fopt__box" aria-hidden="true"></span>' +
        (it.code2 ? '<span class="fcode">' + esc(it.code2) + "</span>" : "") +
        '<span class="fopt__label">' + esc(it.label) + "</span>" +
        '<span class="fopt__n">' + n + "</span></button>";
    }).join("");
    return '<section class="fgroup"><h2 class="fgroup__title">' + esc(title) + "</h2>" +
      '<div class="fgroup__list">' + rows + "</div></section>";
  }

  function renderRail() {
    var rc = facetCounts("region", NAV.regions.map(function (r) { return r.code; }), function (d) { return d.region; });
    var tc = facetCounts("type", NAV.types.map(function (t) { return t.code; }), function (d) { return d.type; });
    var dc = facetCounts("domain", NAV.domains.map(function (x) { return x.code; }), function (d) { return d.domains; });
    var cc = facetCounts("cat", CAT_ORDER, function (d) { return d.catsAll; });

    var n = filtered().length;
    var any = state.q || FACETS.some(function (f) { return state[f].length; });

    var html =
      '<div class="rail__head">' +
        '<span class="rail__count"><b>' + n + "</b> / " + DOCS.length + " 件</span>" +
        (any ? '<button class="rail__reset" id="resetAll">条件をクリア</button>' : "") +
      "</div>" +
      renderGroup("地域", "region", NAV.regions.map(function (r) {
        return { code: r.code, label: r.name, code2: r.code, tip: r.full };
      }), rc) +
      renderGroup("文書種別", "type", NAV.types.map(function (t) {
        return { code: t.code, label: t.name, tip: t.desc };
      }), tc) +
      renderGroup("事業ドメイン", "domain", NAV.domains.map(function (x) {
        return { code: x.code, label: x.name, code2: x.code, tip: x.segment + " — " + x.desc };
      }), dc) +
      renderGroup("業務カテゴリ", "cat", NAV.categories.map(function (c) {
        return { code: c.code, label: c.name, code2: c.code, tip: c.def };
      }), cc);

    el("#rail").innerHTML = html;
  }

  /* ---- documents view -------------------------------------------------- */
  function sortBtn(key, label) {
    var on = state.sort === key;
    return '<button data-sort="' + key + '">' + esc(label) +
      (on ? '<span class="arrow">' + (state.dir === 1 ? "▲" : "▼") + "</span>" : "") + "</button>";
  }

  function activeFilterChips() {
    var out = [];
    if (state.q) out.push('<button class="afchip" data-clear="q"><b>検索</b> ' + esc(state.q) + "</button>");
    FACETS.forEach(function (f) {
      var label = { region: "地域", type: "種別", domain: "ドメイン", cat: "カテゴリ" }[f];
      state[f].forEach(function (code) {
        var name = f === "region" ? regionOf[code].name
                 : f === "type" ? typeOf[code].name
                 : f === "domain" ? domainOf[code].name
                 : catOf[code].name;
        out.push('<button class="afchip" data-facet="' + f + '" data-code="' + code + '"><b>' +
          label + "</b> " + esc(name) + "</button>");
      });
    });
    return out.length ? '<div class="activefilters">' + out.join("") + "</div>" : "";
  }

  function renderDocs() {
    var list = sorted(filtered());
    var rows = list.map(function (d) {
      return '<tr data-id="' + d.id + '" aria-selected="' + (state.selected === d.id) + '">' +
        '<td class="c-doc"><div class="c-doc__short">' + esc(d.short) +
          (d.verify ? '<span class="flag-verify" title="' + esc(d.verify) + '">!</span>' : "") +
        "</div>" +
        '<div class="c-doc__title">' + esc(d.title) + "</div></td>" +
        "<td>" + regionChip(d.region) + "</td>" +
        "<td>" + typeChip(d.type) + "</td>" +
        '<td class="c-issuer">' + esc(d.issuer) + "</td>" +
        '<td class="c-year">' + esc(d.year) + "</td>" +
        '<td class="c-chapn">' + d.chapters.length + "</td>" +
        '<td><div class="chips">' + domChips(d) + "</div></td>" +
        '<td><div class="chips">' + catChips(d, true) + "</div></td>" +
      "</tr>";
    }).join("");

    return '<div class="viewhead">' +
        "<h1>文書一覧</h1>" +
        "<p>行を選ぶと、その文書の章立てと関連文書が右側に開く。" +
        "業務カテゴリの濃い印は文書全体の主用途、薄い印は特定の章だけが該当するもの。" +
        '<span class="flag-verify" style="vertical-align:1px">!</span> は原典で確認すべき記載があることを示す。</p>' +
      "</div>" +
      activeFilterChips() +
      (list.length === 0
        ? '<div class="tablewrap"><div class="empty">条件に一致する文書がありません。</div></div>'
        : '<div class="tablewrap tablewrap--pane"><table class="docs"><thead><tr>' +
            "<th>" + sortBtn("name", "文書") + "</th>" +
            "<th>" + sortBtn("region", "地域") + "</th>" +
            "<th>" + sortBtn("type", "種別") + "</th>" +
            "<th>" + sortBtn("issuer", "発行主体") + "</th>" +
            "<th>" + sortBtn("year", "年") + "</th>" +
            '<th style="text-align:right">' + sortBtn("chapters", "章") + "</th>" +
            "<th>ドメイン</th><th>業務カテゴリ</th>" +
          "</tr></thead><tbody>" + rows + "</tbody></table></div>");
  }

  /* ---- categories view ------------------------------------------------- */
  function renderCats() {
    var counts = {};
    CAT_ORDER.forEach(function (c) {
      counts[c] = DOCS.filter(function (d) { return has(d.catsAll, c); }).length;
    });

    var m = NAV.meceNote;
    var clusters = NAV.clusters.map(function (cl) {
      var cards = NAV.categories.filter(function (c) { return c.cluster === cl.code; }).map(function (c) {
        return '<button class="catcard" data-gocat="' + c.code + '">' +
          '<div class="catcard__head">' +
            '<span class="catcard__code">' + c.code + "</span>" +
            '<span class="catcard__name">' + esc(c.name) + "</span>" +
            '<span class="catcard__n">' + counts[c.code] + " 文書</span>" +
          "</div>" +
          '<p class="catcard__def">' + esc(c.def) + "</p>" +
          '<div class="catcard__sub">主な成果物</div>' +
          '<ul class="catcard__list">' + c.outputs.map(function (o) {
            return "<li>" + esc(o) + "</li>";
          }).join("") + "</ul>" +
          '<div class="catcard__roles">担当: ' + esc(c.roles.join("、")) + "</div>" +
          '<div class="catcard__tb"><b>境界の判定ルール</b>' + esc(c.tiebreak) + "</div>" +
        "</button>";
      }).join("");

      return '<section class="cluster">' +
        '<div class="cluster__head">' +
          '<span class="cluster__code">' + cl.code + "</span>" +
          '<span class="cluster__name">' + esc(cl.name) + "</span>" +
          '<span class="cluster__desc">' + esc(cl.desc) + "</span>" +
        "</div>" +
        '<div class="catgrid">' + cards + "</div>" +
      "</section>";
    }).join("");

    return '<div class="viewhead">' +
        "<h1>業務カテゴリ体系</h1>" +
        "<p>サイバーセキュリティ業務を11に分割した MECE な分類。カードを選ぶと、そのカテゴリに該当する文書の一覧に移動する。</p>" +
      "</div>" +
      '<div class="mecebox">' +
        '<div class="mecebox__row"><div class="mecebox__k">分割軸</div><div class="mecebox__v">' + esc(m.axis) + "</div></div>" +
        '<div class="mecebox__row"><div class="mecebox__k">漏れがない</div><div class="mecebox__v">' + esc(m.exhaustive) + "</div></div>" +
        '<div class="mecebox__row"><div class="mecebox__k">重なりがない</div><div class="mecebox__v">' + esc(m.exclusive) + "</div></div>" +
        '<div class="mecebox__row"><div class="mecebox__k">注意</div><div class="mecebox__v"><b>' + esc(m.caveat) + "</b></div></div>" +
      "</div>" +
      clusters;
  }

  /* ---- matrix view ----------------------------------------------------- */
  function renderMatrix() {
    var grid = {}, max = 0, min = Infinity;
    NAV.domains.forEach(function (dm) {
      grid[dm.code] = {};
      CAT_ORDER.forEach(function (c) {
        var n = DOCS.filter(function (d) {
          return has(d.domains, dm.code) && has(d.catsAll, c);
        }).length;
        grid[dm.code][c] = n;
        if (n > max) max = n;
        if (n < min) min = n;
      });
    });
    /* 実データの下限が 0 から離れているため、[min, max] に正規化しないと
       濃淡がほとんど付かない。0 だけは無色にして「該当なし」を区別する。 */
    var span = Math.max(1, max - min);
    function tint(n) {
      if (n === 0) return "transparent";
      var a = (n - min) / span;
      return "color-mix(in srgb, var(--accent) " + Math.round(8 + a * 46) + "%, transparent)";
    }

    var head = '<tr><th style="text-align:left">事業ドメイン</th>' +
      CAT_ORDER.map(function (c) {
        return '<th class="mx-cat" title="' + esc(catOf[c].name) + '">' + c + "</th>";
      }).join("") + '<th class="mx-cat">計</th></tr>';

    var body = NAV.domains.map(function (dm) {
      var tot = DOCS.filter(function (d) { return has(d.domains, dm.code); }).length;
      return "<tr><th>" + esc(dm.name) + '<span class="seg">' + esc(dm.segment) + "</span></th>" +
        CAT_ORDER.map(function (c) {
          var n = grid[dm.code][c];
          return '<td style="background:' + tint(n) + '"><button class="mxcell" data-zero="' + (n === 0) +
            '" data-dm="' + dm.code + '" data-cat="' + c + '" title="' +
            esc(dm.name + " × " + catOf[c].name + " — " + n + " 文書") +
            '">' + n + "</button></td>";
        }).join("") +
        '<td class="mxtot"><span class="mxcell">' + tot + "</span></td></tr>";
    }).join("");

    return '<div class="viewhead">' +
        "<h1>ドメイン × 業務カテゴリ</h1>" +
        "<p>三菱電機の事業ドメインごとに、どの業務カテゴリに文書が集まっているかを示す。" +
        "数値はその組み合わせに該当する文書数。セルを選ぶとその条件で一覧を絞り込む。" +
        "薄いセルは対象文書が少ない領域で、参照すべき文書が本当に無いのか、収録が足りていないのかを点検する手掛かりになる。</p>" +
      "</div>" +
      '<div class="tablewrap" style="padding:2px"><table class="matrix">' +
        "<thead>" + head + "</thead><tbody>" + body + "</tbody></table></div>" +
      '<div class="legend"><span>' + min + " 文書</span>" +
        '<span class="legend__scale">' +
        [0, .25, .5, .75, 1].map(function (a) {
          return '<span class="legend__sw" style="background:color-mix(in srgb, var(--accent) ' +
            Math.round(8 + a * 46) + '%, transparent)"></span>';
        }).join("") +
      "</span><span>" + max + " 文書</span></div>";
  }

  /* ---- relations view -------------------------------------------------- */
  function renderRels() {
    var pool = filtered();
    var inPool = {};
    pool.forEach(function (d) { inPool[d.id] = 1; });

    var groups = {};
    Object.keys(NAV.relKinds).forEach(function (k) { groups[k] = []; });
    pool.forEach(function (d) {
      d.rel.forEach(function (r) {
        if (!byId[r.to]) return;
        groups[r.kind].push({ from: d, to: byId[r.to], note: r.note, both: !!inPool[r.to] });
      });
    });

    var total = Object.keys(groups).reduce(function (a, k) { return a + groups[k].length; }, 0);

    var sections = Object.keys(NAV.relKinds).map(function (k) {
      var list = groups[k];
      if (!list.length) return "";
      var kind = NAV.relKinds[k];
      var edges = list.map(function (e) {
        return '<div class="reledge">' +
          '<div class="reledge__side">' + regionChip(e.from.region) +
            '<button class="reledge__name" data-id="' + e.from.id + '">' + esc(e.from.short) + "</button></div>" +
          '<div class="reledge__mid"><span class="reledge__arrow">──▶ ' + esc(kind.label) + "</span></div>" +
          '<div class="reledge__side">' + regionChip(e.to.region) +
            '<button class="reledge__name" data-id="' + e.to.id + '">' + esc(e.to.short) + "</button></div>" +
          (e.note ? '<div class="reledge__note">' + esc(e.note) + "</div>" : "") +
        "</div>";
      }).join("");
      return '<section class="d-sec"><h2 class="d-sec__h">' + esc(kind.label) +
        '<span class="n">' + list.length + "</span> — " + esc(kind.desc) + "</h2>" +
        '<div class="reledges">' + edges + "</div></section>";
    }).join("");

    return '<div class="viewhead">' +
        "<h1>文書間の関係</h1>" +
        "<p>左の文書から見た関係を、関係の種類ごとに並べる。左側の絞り込み条件は関係の起点となる文書に適用される。" +
        "国際規格が各法域でどう受け入れられ、法令が何を実装手段として想定しているかは、" +
        "「実装手段」と「国内適用」の2つの群を見るのが早い。</p>" +
      "</div>" +
      activeFilterChips() +
      (total === 0 ? '<div class="empty">条件に一致する関係がありません。</div>' : sections);
  }

  /* ---- drawer ---------------------------------------------------------- */
  function relBlock(d) {
    var out = [];
    var groups = {};
    d.rel.forEach(function (r) {
      if (!byId[r.to]) return;
      (groups[r.kind] = groups[r.kind] || []).push({ doc: byId[r.to], note: r.note, dir: "out" });
    });
    d.relIn.forEach(function (r) {
      if (!byId[r.from]) return;
      var k = "in:" + r.kind;
      (groups[k] = groups[k] || []).push({ doc: byId[r.from], note: r.note, dir: "in" });
    });

    var order = Object.keys(NAV.relKinds).concat(Object.keys(NAV.relKinds).map(function (k) { return "in:" + k; }));
    order.forEach(function (k) {
      var list = groups[k];
      if (!list || !list.length) return;
      var incoming = k.indexOf("in:") === 0;
      var kind = NAV.relKinds[incoming ? k.slice(3) : k];
      out.push('<div class="relgroup"><div class="relgroup__h">' +
        '<span class="kindbadge">' + (incoming ? "◀ 被参照" : "▶ 参照") + "</span>" +
        esc(incoming ? "この文書を「" + kind.label + "」として挙げている文書" : kind.label) +
        "</div>" +
        list.map(function (e) {
          return '<button class="rellink" data-id="' + e.doc.id + '">' +
            '<div class="rellink__top">' + regionChip(e.doc.region) + typeChip(e.doc.type) +
              '<span class="rellink__name">' + esc(e.doc.short) + "</span></div>" +
            (e.note ? '<div class="rellink__note">' + esc(e.note) + "</div>" : "") +
          "</button>";
        }).join("") + "</div>");
    });
    return out.length ? out.join("") : '<p style="color:var(--ink-3);font-size:12.5px">登録された関係はありません。</p>';
  }

  function renderDrawer(d) {
    var bar = el("#drawerBar"), body = el("#drawerBody");
    if (!d) { el("#drawer").setAttribute("data-open", "false"); el("#scrim").setAttribute("data-open", "false"); return; }

    bar.innerHTML = '<div class="chips">' + regionChip(d.region) + typeChip(d.type) +
      '<span class="chip chip--code">' + esc(d.year) + "</span></div>" +
      '<button class="iconbtn" id="drawerClose" aria-label="閉じる">✕</button>';

    var chapters = d.chapters.map(function (ch) {
      return '<div class="chap"><div class="chap__head">' +
        '<span class="chap__no">' + esc(ch.no) + "</span>" +
        '<span class="chap__title">' + esc(ch.title) + "</span></div>" +
        (ch.note ? '<div class="chap__note">' + esc(ch.note) + "</div>" : "") +
        ((ch.cat && ch.cat.length)
          ? '<div class="chap__cats">' + ch.cat.map(function (c) {
              return '<span class="chip chip--code chip--cat" title="' + esc(catOf[c] ? catOf[c].name : c) + '">' + c + "</span>";
            }).join("") + "</div>"
          : "") +
      "</div>";
    }).join("");

    body.innerHTML =
      '<h2 class="d-title">' + esc(d.short) + "</h2>" +
      '<p class="d-fulltitle">' + esc(d.title) + "</p>" +
      (d.orig ? '<p class="d-orig">' + esc(d.orig) + "</p>" : "") +
      (d.verify ? '<div class="d-note"><b>要確認 </b>' + esc(d.verify) + "</div>" : "") +
      '<dl class="d-meta">' +
        "<dt>発行主体</dt><dd>" + esc(d.issuer) + "</dd>" +
        "<dt>版・年</dt><dd>" + esc(d.version || "—") + "（" + esc(d.year) + "）</dd>" +
        "<dt>拘束力</dt><dd>" + esc(d.binding || "—") + "</dd>" +
        "<dt>事業ドメイン</dt><dd>" + d.domains.map(function (x) {
          return esc(domainOf[x] ? domainOf[x].name : x);
        }).join("、") + "</dd>" +
        "<dt>原典</dt><dd><a href=\"" + esc(d.url) + "\" target=\"_blank\" rel=\"noopener noreferrer\">" +
          esc(d.url) + "</a></dd>" +
      "</dl>" +
      '<section class="d-sec"><h2 class="d-sec__h">概要</h2><p>' + esc(d.summary) + "</p></section>" +
      '<section class="d-sec"><h2 class="d-sec__h">適用対象</h2><p>' + esc(d.scope) + "</p></section>" +
      '<section class="d-sec"><h2 class="d-sec__h">主な業務カテゴリ</h2>' +
        '<div class="chips" style="max-width:none">' + catChips(d, true) + "</div>" +
        '<p style="font-size:11.5px;color:var(--ink-3);margin-top:6px">' +
        "濃い印は文書全体としての主用途、薄い印は特定の章だけが該当するもの。</p></section>" +
      '<section class="d-sec"><h2 class="d-sec__h">章立て<span class="n">' + d.chapters.length + "</span></h2>" +
        chapters + "</section>" +
      '<section class="d-sec"><h2 class="d-sec__h">関連文書</h2>' + relBlock(d) + "</section>";

    el("#drawer").setAttribute("data-open", "true");
    el("#scrim").setAttribute("data-open", "true");
    body.scrollTop = 0;
  }

  function select(id) {
    state.selected = id;
    renderDrawer(byId[id]);
    var rows = document.querySelectorAll("table.docs tbody tr");
    for (var i = 0; i < rows.length; i++) {
      rows[i].setAttribute("aria-selected", rows[i].getAttribute("data-id") === id);
    }
  }
  function closeDrawer() {
    state.selected = null;
    renderDrawer(null);
    var rows = document.querySelectorAll("table.docs tbody tr");
    for (var i = 0; i < rows.length; i++) rows[i].setAttribute("aria-selected", "false");
  }

  /* ---- render root ----------------------------------------------------- */
  function render() {
    var main = el("#main");
    if (state.view === "docs") main.innerHTML = renderDocs();
    else if (state.view === "cats") main.innerHTML = renderCats();
    else if (state.view === "matrix") main.innerHTML = renderMatrix();
    else if (state.view === "rels") main.innerHTML = renderRels();
    renderRail();

    var tabs = document.querySelectorAll(".viewtab");
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].setAttribute("aria-selected", tabs[i].getAttribute("data-view") === state.view);
    }
    var showRail = state.view === "docs" || state.view === "rels";
    el("#rail").style.visibility = showRail ? "" : "hidden";
    el(".shell").style.gridTemplateColumns = showRail ? "" : "0 minmax(0,1fr)";
  }

  function toggleFacet(facet, code) {
    var arr = state[facet];
    var i = arr.indexOf(code);
    if (i === -1) arr.push(code); else arr.splice(i, 1);
    render();
  }

  /* ---- events ---------------------------------------------------------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target;

    var tab = t.closest(".viewtab");
    if (tab) { state.view = tab.getAttribute("data-view"); render(); return; }

    var fopt = t.closest(".fopt");
    if (fopt) { toggleFacet(fopt.getAttribute("data-facet"), fopt.getAttribute("data-code")); return; }

    var af = t.closest(".afchip");
    if (af) {
      if (af.getAttribute("data-clear") === "q") { state.q = ""; el("#q").value = ""; render(); }
      else toggleFacet(af.getAttribute("data-facet"), af.getAttribute("data-code"));
      return;
    }

    if (t.closest("#resetAll")) {
      state.q = ""; el("#q").value = "";
      FACETS.forEach(function (f) { state[f] = []; });
      render(); return;
    }

    var sortEl = t.closest("[data-sort]");
    if (sortEl) {
      var k = sortEl.getAttribute("data-sort");
      if (state.sort === k) state.dir = -state.dir; else { state.sort = k; state.dir = 1; }
      render(); return;
    }

    var cc = t.closest("[data-gocat]");
    if (cc) {
      state.cat = [cc.getAttribute("data-gocat")];
      state.view = "docs";
      render(); return;
    }

    var mx = t.closest(".mxcell[data-dm]");
    if (mx) {
      state.domain = [mx.getAttribute("data-dm")];
      state.cat = [mx.getAttribute("data-cat")];
      state.view = "docs";
      render(); return;
    }

    var link = t.closest("[data-id]");
    if (link) { select(link.getAttribute("data-id")); return; }

    if (t.closest("#drawerClose") || t.closest("#scrim")) { closeDrawer(); return; }

    if (t.closest("#railToggle")) {
      var r = el("#rail");
      r.setAttribute("data-open", r.getAttribute("data-open") === "true" ? "false" : "true");
      return;
    }
    if (t.closest("#themeToggle")) {
      var root = document.documentElement;
      var cur = root.getAttribute("data-theme");
      var isDark = cur ? cur === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      root.setAttribute("data-theme", isDark ? "light" : "dark");
      return;
    }
    if (t.closest("#clearQ")) { state.q = ""; el("#q").value = ""; render(); return; }
  });

  el("#q").addEventListener("input", function (e) {
    state.q = e.target.value.trim();
    render();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeDrawer(); return; }
    if (e.key === "/" && document.activeElement !== el("#q")) {
      e.preventDefault(); el("#q").focus();
    }
  });

  render();
})();

</script>
</body>
</html>
